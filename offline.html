<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRSAV — You're Offline</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#060f2e">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;
    background:#060f2e;color:#fff;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 24px;text-align:center;
  }
  .icon{
    width:80px;height:80px;border-radius:18px;
    background:linear-gradient(135deg,#1a6fff,#0a3aff);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;letter-spacing:-0.02em;
    color:#fff;margin:0 auto 32px;
    box-shadow:0 0 40px rgba(26,111,255,0.4);
  }
  h1{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:12px}
  p{font-size:16px;color:rgba(255,255,255,0.5);max-width:380px;line-height:1.6;margin-bottom:36px}
  .phone{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(26,111,255,0.15);
    border:1px solid rgba(26,111,255,0.3);
    border-radius:100px;padding:12px 24px;
    font-size:18px;font-weight:700;color:#4d8fff;
    text-decoration:none;margin-bottom:16px;
  }
  .retry{
    background:#1a6fff;color:#fff;border:none;
    padding:12px 32px;border-radius:8px;
    font-size:15px;font-weight:600;cursor:pointer;
    transition:background 0.2s;
  }
  .retry:hover{background:#4d8fff}
  .divider{color:rgba(255,255,255,0.2);margin:12px 0;font-size:13px}
</style>
</head>
<body>
  <div class="icon">TRS</div>
  <h1>You're Offline</h1>
  <p>No internet connection right now. You can still call us directly — we're available 24/7.</p>
  <a href="tel:8664018600" class="phone">📞 866-401-8600</a>
  <div class="divider">or</div>
  <button class="retry" onclick="window.location.reload()">Try Again →</button>
</body>
</html>
